# Render Blueprint: one web service plus a free Postgres database.
# In Render: New > Blueprint, pick this repo, then fill in the keys it asks for.
services:
  - type: web
    name: juno
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juno-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: COPILOT_GITHUB_TOKEN
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: SEED_OWNER_EMAIL
        sync: false

databases:
  - name: juno-db
    plan: free
